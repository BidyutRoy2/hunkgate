[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunkgate"
version = "0.1.0"
description = "The human gate for agent-written code: review a diff hunk by hunk, approve what you trust, apply only that, and send the rest back to the agent as a structured prompt. Deterministic, offline, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bidyut Roy", email = "bidyut@example.com" }]
keywords = [
    "ai-coding-agents", "code-review", "human-in-the-loop", "agent-supervision",
    "diff", "hunk", "approval", "cli", "local-first", "deterministic",
    "offline", "claude-code", "codex", "plannotator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BidyutRoy2/hunkgate"
Repository = "https://github.com/BidyutRoy2/hunkgate"
Issues = "https://github.com/BidyutRoy2/hunkgate/issues"

[project.scripts]
hunkgate = "hunkgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
