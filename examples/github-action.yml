# Example GitHub Actions workflow: gate a PR on the human decision.
# Copy to .github/workflows/agent-gate.yml in your repo.
name: agent-gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hunkgate
        run: python -m pip install -e .  # from source; no PyPI package yet
      - name: Capture the PR diff
        run: |
          hunkgate init
          git diff origin/main...HEAD > /tmp/pr.diff
          hunkgate capture /tmp/pr.diff --title "PR #${{ github.event.number }}"
      - name: Gate on the human decision
        run: |
          ITEM=$(hunkgate list | head -1 | awk '{print $1}')
          hunkgate ci "$ITEM"
